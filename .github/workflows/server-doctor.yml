name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            cd /opt/komenin
            echo "=== is 3000 listening on host? ==="
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':3000' || echo "(nothing on :3000)"
            echo "=== app container ports ==="
            sudo docker port komenin-app-1 || true
            sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | head -n 10 || true
            echo "=== vhost now ==="
            sudo grep -n "proxy_pass" /etc/nginx/sites-enabled/komenin.id || true
            echo "=== nginx test + direct backend check ==="
            curl -sS -m 10 -o /dev/null -w "via-nginx-http=%{http_code}\n" http://127.0.0.1/ || true
            curl -sS -m 10 -o /dev/null -w "direct-3000=%{http_code}\n" http://127.0.0.1:3000/api/health || true
            echo "=== nginx error log tail ==="
            sudo tail -n 20 /var/log/nginx/error.log 2>/dev/null || true
