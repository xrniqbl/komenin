name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            echo "=== nginx vhosts mentioning komenin ==="
            sudo grep -rln "komenin" /etc/nginx/ 2>/dev/null | head -n 10 || true
            echo "=== proxy_pass targets ==="
            sudo grep -rn "proxy_pass" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | head -n 20 || true
            echo "=== full komenin vhost ==="
            sudo grep -rl "komenin.id" /etc/nginx/ 2>/dev/null | head -n 3 | xargs -r sudo cat 2>/dev/null | head -n 80 || true
