name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/komenin
            echo "=== recent server-component errors with digest ==="
            sudo docker compose logs --tail=3000 app 2>/dev/null | grep -B2 -A25 -E "Error \[|digest:|Failed to .* action|Failed to fetch|Unhandled" | head -n 120 || true
            echo "=== workspaces for iqbal ==="
            sudo docker compose exec -T db psql -U "${POSTGRES_USER:-komenin}" -d "${POSTGRES_DB:-komenin}" -c "SELECT w.id, w.name, w.slug, w.\"createdAt\", m.role FROM \"Workspace\" w JOIN \"Membership\" m ON m.\"workspaceId\" = w.id JOIN \"User\" u ON u.id = m.\"userId\" WHERE u.email = 'iqblsptr04@gmail.com' ORDER BY w.\"createdAt\";" 2>&1 | head -n 20 || true
