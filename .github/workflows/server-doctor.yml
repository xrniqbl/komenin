name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/komenin
            echo "=== full prisma error block ==="
            sudo docker compose logs --tail=2000 app 2>/dev/null | grep -A30 "PrismaClientKnownRequestError" | head -n 60 || true
