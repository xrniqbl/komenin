name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            cd /opt/komenin
            echo "=== onboarding/campaign errors in app logs (last 500) ==="
            sudo docker compose logs --tail=500 app 2>/dev/null | grep -iE "onboarding|campaign|template|digest|NEXT_REDIRECT|Error|error" | grep -viE "error-report|error\.tsx|sentry|ErrorBoundary" | tail -n 40 || true
