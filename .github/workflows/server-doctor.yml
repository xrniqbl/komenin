name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/komenin
            echo "=== columns now ==="
            sudo docker compose exec -T db psql -U "${POSTGRES_USER:-komenin}" -d "${POSTGRES_DB:-komenin}" -c "\d \"Workspace\"" 2>&1 | grep -iE "aiDefault|aiFallback|aiTemperature|aiMaxTokens|agencyLabel|aiPrefer|aiPayg" | head -n 12 || true
            echo "=== migration applied? ==="
            sudo docker compose exec -T db psql -U "${POSTGRES_USER:-komenin}" -d "${POSTGRES_DB:-komenin}" -c "SELECT migration_name FROM _prisma_migrations ORDER BY finished_at DESC LIMIT 3;" 2>&1 | head -n 8 || true
            echo "=== fresh P2022 since deploy? ==="
            sudo docker compose logs --tail=500 app 2>/dev/null | grep -c "P2022" || true
            echo "=== live /app check ==="
            curl -sS -m 20 -o /dev/null -w "app=%{http_code}\n" https://komenin.id/app || true
