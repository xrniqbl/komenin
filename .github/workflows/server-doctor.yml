name: Server Doctor (manual diagnostics)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production server routing
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -x
            cd /opt/komenin
            echo "=== all containers (all projects) ==="
            sudo docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' | head -n 30 || true
            echo "=== what listens on 80/443 ==="
            sudo ss -ltnp 2>/dev/null | grep -E ':80|:443' | head -n 10 || sudo netstat -ltnp 2>/dev/null | grep -E ':80|:443' | head -n 10 || true
            echo "=== traefik static/dynamic config files ==="
            sudo ls -la /opt/komenin/traefik* /opt/traefik* /etc/traefik* 2>/dev/null || true
            sudo find /opt/komenin -maxdepth 3 -iname '*traefik*' 2>/dev/null | head -n 20 || true
            echo "=== traefik file provider content (routers for komenin.id) ==="
            sudo grep -rn "komenin" /opt/komenin/traefik* /etc/traefik* 2>/dev/null | grep -viE "password|secret|token|key" | head -n 30 || true
            echo "=== traefik container? (any name) ==="
            sudo docker ps --format '{{.Names}} {{.Image}}' | grep -iE "traefik|proxy|caddy|nginx" || echo "(no reverse proxy container found)"
            echo "=== app labels (traefik routing) ==="
            sudo docker inspect komenin-app-1 --format '{{json .Config.Labels}}' 2>/dev/null | tr ',' '\n' | grep -i traefik | head -n 10 || true
            echo "=== app direct ==="
            sudo docker compose exec -T app node -e "fetch('http://localhost:3000/api/health').then(async (r) => console.log('app direct:', r.status, (await r.text()).slice(0,60))).catch((e) => console.log('app direct FAIL:', e.message))" || true
