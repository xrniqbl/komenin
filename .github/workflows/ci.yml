name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Advisory by default so a new CVE does not hard-block every PR; the
    # result is visible as a failing red X on the audit job for triage.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
