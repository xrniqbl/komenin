##
## Komenin + Traefik — multi-site stack untuk 1 VPS
## Traefik jadi reverse-proxy + auto HTTPS (Let's Encrypt) untuk banyak web.
##
## Cara pakai:
##   1. cp .env.docker.example .env.docker  (lalu isi nilainya)
##   2. docker compose --env-file .env.docker up -d --build
##
## Menambah web lain: tambahkan service baru dengan label Traefik (lihat contoh `web2`).
##

networks:
  web:
    name: web
    external: false
  internal:
    name: internal
    external: false

volumes:
  db_data:
  db_backups:
  traefik_letsencrypt:

services:
  # ─────────────────────────────────────────────
  # Traefik — reverse proxy + HTTPS otomatis
  # ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # redirect HTTP -> HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (TLS-ALPN)
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    networks:
      - web

  # ─────────────────────────────────────────────
  # PostgreSQL — database Komenin
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - "db_data:/var/lib/postgresql/data"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Komenin — aplikasi Next.js
  # CI deploy men-set KOMENIN_IMAGE ke tag GHCR SHA; tanpa itu compose
  # memakai image lokal (komenin:latest) atau build dari source.
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KOMENIN_IMAGE:-komenin:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Self-hosted Postgres (@db) tanpa PgBouncer: DIRECT boleh identik dengan
      # DATABASE_URL. Di Neon/Vercel keduanya wajib beda (pooler vs direct).
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public}
      APP_URL: "https://${KOMENIN_DOMAIN}"
      AUTH_URL: "https://${KOMENIN_DOMAIN}"
      AUTH_TRUST_HOST: "false"
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-false}
      ALLOW_SECURITY_STUBS: "false"
      SSO_ENFORCE_LOGIN: "false"
      SAML_ALLOW_UNSIGNED: "false"
      WORKER_SECRET: ${WORKER_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      # OAuth state / SSO ticket / API-key pepper — tanpa fallback AUTH_SECRET di prod
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      SSO_TICKET_SECRET: ${SSO_TICKET_SECRET}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      # Durable rate limiting (wajib prod — memory fallback lemah di serverless/Docker scale)
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      # Email transaksional (wajib prod — OTP login + digest gagal diam-diam tanpanya)
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SUPPORT_INBOX_EMAIL: ${SUPPORT_INBOX_EMAIL:-}
      AI_GATEWAY_ENABLED: ${AI_GATEWAY_ENABLED:-false}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_MODEL_PRIMARY: ${AI_MODEL_PRIMARY:-}
      AI_MODEL_FALLBACKS: ${AI_MODEL_FALLBACKS:-}
      AI_RATE_LIMIT_PER_MIN: ${AI_RATE_LIMIT_PER_MIN:-60}
      KOMENIN_AI_MODELS_STARTER: ${KOMENIN_AI_MODELS_STARTER:-}
      KOMENIN_AI_MODELS_PRO: ${KOMENIN_AI_MODELS_PRO:-}
      KOMENIN_AI_MODELS_PRO_MAX: ${KOMENIN_AI_MODELS_PRO_MAX:-}
      AI_MODEL_COST_IDR: ${AI_MODEL_COST_IDR:-}
      SOCIAL_PUBLISH_WEBHOOK_URL: ${SOCIAL_PUBLISH_WEBHOOK_URL:-}
      SOCIAL_PUBLISH_WEBHOOK_TOKEN: ${SOCIAL_PUBLISH_WEBHOOK_TOKEN:-}
      SOCIAL_CONNECTOR_POLICY: ${SOCIAL_CONNECTOR_POLICY:-prefer_webhook}
      INSTAGRAM_GRAPH_BASE_URL: ${INSTAGRAM_GRAPH_BASE_URL:-https://graph.facebook.com/v21.0}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      THREADS_APP_ID: ${THREADS_APP_ID:-}
      THREADS_APP_SECRET: ${THREADS_APP_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_PLAINTEXT_OK: ${BACKUP_PLAINTEXT_OK:-}
      KOMENIN_REGION: ${KOMENIN_REGION:-ap-southeast-1}
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.komenin.rule=Host(`${KOMENIN_DOMAIN}`)"
      - "traefik.http.routers.komenin.entrypoints=websecure"
      - "traefik.http.routers.komenin.tls.certresolver=le"
      - "traefik.http.services.komenin.loadbalancer.server.port=3000"

  # ─────────────────────────────────────────────
  # Cron — scheduler untuk job worker. Jalur Vercel punya vercel.json crons,
  # tapi di stack Docker TIDAK ADA scheduler bawaan: tanpa service ini
  # comment.send / content.publish / billing.expire tidak pernah jalan.
  # Memanggil /api/worker/cron?job=… dengan CRON_SECRET (satu container
  # busybox crond, tanpa image tambahan yang harus dirawat).
  # ─────────────────────────────────────────────
  cron:
    image: busybox:1.36
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - "./deploy/cron-jobs:/opt/cron-jobs:ro"
      - "./deploy/cron-entrypoint.sh:/usr/local/bin/cron-entrypoint.sh:ro"
    command: ["/bin/sh", "/usr/local/bin/cron-entrypoint.sh"]
    networks:
      - internal

  # ─────────────────────────────────────────────
  # Backup — pg_dump harian via scripts/backup-db.sh (gzip + AES opsional +
  # upload S3 opsional). Wajib: DATABASE_URL mengarah ke service db.
  # Set BACKUP_ENCRYPTION_KEY (openssl rand -hex 32) agar dump terenkripsi.
  # ─────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
    volumes:
      - "db_backups:/backups"
      - "./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro"
    entrypoint: >
      sh -c "chmod +x /usr/local/bin/backup-db.sh 2>/dev/null || true;
      echo '15 2 * * * sh /usr/local/bin/backup-db.sh' > /var/spool/cron/crontabs/root &&
      sh /usr/local/bin/backup-db.sh || true;
      exec crond -f -l 8"
    networks:
      - internal

  # ─────────────────────────────────────────────
  # CONTOH web kedua di VPS yang sama (opsional).
  # Hapus / duplikasi block ini untuk tiap situs tambahan.
  # ─────────────────────────────────────────────
  # web2:
  #   image: nginx:alpine
  #   restart: unless-stopped
  #   networks:
  #     - web
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.web2.rule=Host(`${WEB2_DOMAIN}`)"
  #     - "traefik.http.routers.web2.entrypoints=websecure"
  #     - "traefik.http.routers.web2.tls.certresolver=le"
  #     - "traefik.http.services.web2.loadbalancer.server.port=80"